<!DOCTYPE html>
<html>
<head>
  <style>
    .rgb { background-color: rgb(100, 200, 50); }
    .rgba { background-color: rgba(255, 0, 0, 0.5); }
    .rgb-0 { background-color: rgb(0, 0, 0); }
    .rgb-255 { background-color: rgb(255, 255, 255); border: 1px solid black; }
  </style>
</head>
<body>
  <div class="rgb">rgb(100, 200, 50)</div>
  <div class="rgba">rgba(255, 0, 0, 0.5)</div>
  <div class="rgb-0">rgb(0,0,0)</div>
  <div class="rgb-255">rgb(255,255,255)</div>
</body>
</html>
