<!DOCTYPE html>
<html>
<head>
  <style>
    .block { display: block; background-color: #ddd; margin: 5px 0; padding: 5px; }
    .inline { display: inline; background-color: #afa; }
  </style>
</head>
<body>
  <span class="block">First block</span>
  <span class="block">Second block (new line)</span>
  <span class="inline">inline one</span>
  <span class="inline">inline two</span>
</body>
</html>
