<!DOCTYPE html>
<html>
<head>
  <style>
    .highlight { background-color: yellow; }
    .important { font-weight: bold; }
    .both.highlight.important { background-color: red; }
  </style>
</head>
<body>
  <p class="highlight">highlighted</p>
  <p class="important">important</p>
  <p class="highlight important">both</p>
  <p>none</p>
</body>
