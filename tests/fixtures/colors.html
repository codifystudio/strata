<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Colors and Borders</title>
  <style>
    body { margin: 0; padding: 20px; background-color: #fafafa; }
    .box {
      width: 100px;
      height: 100px;
      margin: 10px;
      display: inline-block;
    }
    .red { background-color: red; }
    .green { background-color: #00ff00; }
    .blue { background-color: rgb(0, 0, 255); }
    .semi { background-color: rgba(0, 0, 0, 0.5); }
    .bordered {
      background-color: white;
      border: 2px solid black;
    }
    .thick {
      background-color: white;
      border: 5px solid #ff6600;
    }
  </style>
</head>
<body>
  <h1>Colors and Borders</h1>
  <div>
    <div class="box red"></div>
    <div class="box green"></div>
    <div class="box blue"></div>
    <div class="box semi"></div>
    <div class="box bordered"></div>
    <div class="box thick"></div>
  </div>
</body>
</html>
