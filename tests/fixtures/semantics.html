<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>List and Semantics</title>
  <style>
    body { margin: 20px; font-family: sans-serif; }
    header, footer, main, nav, article, section, aside { display: block; margin: 10px 0; padding: 10px; }
    header { background-color: #e0e0ff; }
    nav { background-color: #e0ffe0; }
    main { background-color: #ffffe0; }
    aside { background-color: #ffe0e0; }
    footer { background-color: #e0e0e0; }
  </style>
</head>
<body>
  <header>Header: Site Title</header>
  <nav>Navigation: Home | About | Contact</nav>
  <main>
    <article>
      <h1>Article Heading</h1>
      <p>First paragraph with some text.</p>
      <section>
        <h2>Section Heading</h2>
        <p>Section content.</p>
      </section>
    </article>
    <aside>Aside: Related links</aside>
  </main>
  <footer>Footer: Copyright 2026</footer>
</body>
</html>
