[workspace]
resolver = "2"
members = [
    "crates/strata-core",
    "crates/strata-network",
    "crates/strata-dom",
    "crates/strata-html",
    "crates/strata-css",
    "crates/strata-layout",
    "crates/strata-paint",
    "crates/strata-js",
    "crates/strata-window",
    "crates/strata-browser",
    "crates/strata-bench",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/codifystudio/strata"
description = "Strata — независимый браузерный движок на Rust"
authors = ["codifystudio"]

[workspace.dependencies]
# Внутренние крейты
strata-core   = { path = "crates/strata-core" }
strata-network = { path = "crates/strata-network" }
strata-dom    = { path = "crates/strata-dom" }
strata-html   = { path = "crates/strata-html" }
strata-css    = { path = "crates/strata-css" }
strata-layout = { path = "crates/strata-layout" }
strata-paint  = { path = "crates/strata-paint" }
strata-js     = { path = "crates/strata-js" }
strata-window = { path = "crates/strata-window" }

# Парсинг HTML/CSS
html5ever = "0.29"
markup5ever = "0.14"
cssparser = "0.34"
selectors = "0.26"

# Layout
taffy = "0.7"

# Paint
tiny-skia = "0.11"

# Сеть
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "gzip", "brotli", "stream"] }
tokio = { version = "1", features = ["full"] }
url = "2"
rustls = "0.23"
data-encoding = "2"

# DOM / сериализация
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Окно
winit = "0.30"
softbuffer = "0.4"
raw-window-handle = "0.6"

# Бенчмарки
criterion = { version = "0.5", features = ["html_reports"] }

# Утилиты
log = "0.4"
env_logger = "0.11"
thiserror = "1"
anyhow = "1"
parking_lot = "0.12"
ahash = "0.8"
smallvec = "1"
smol_str = "0.2"
string_cache = "0.8"
typed-arena = "2"

# JS движок
boa_engine = "0.20"
boa_runtime = "0.20"

# Изображения
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "unwind"
